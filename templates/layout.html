<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - Download from YouTube, Instagram, and Twitter/X</title>
    
    <!-- Bootstrap CSS (Replit dark theme) -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
    <header class="bg-body-tertiary py-3">
        <div class="container">
            <div class="d-flex align-items-center justify-content-center">
                <h1 class="h3 mb-0 text-center">
                    <i class="fas fa-download me-2"></i>Video Downloader
                </h1>
            </div>
        </div>
    </header>

    <main class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-body-tertiary py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">Supported platforms: 
                <span class="badge bg-danger me-1"><i class="fab fa-youtube me-1"></i>YouTube</span>
                <span class="badge bg-primary me-1"><i class="fab fa-instagram me-1"></i>Instagram</span>
                <span class="badge bg-info"><i class="fab fa-twitter me-1"></i>Twitter/X</span>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
